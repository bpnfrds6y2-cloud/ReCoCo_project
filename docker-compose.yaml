services:
  pytorch:
    container_name: recoco_global_model
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    ports:
      - "8891:8888" 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu] 
    environment: 
      - NVIDIA_VISIBLE_DEVICES=all 
    tty: true
    stdin_open: true

    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root -- NotebookApp.token='' --NotebookApp.password=''
